[workspace]
resolver = "2"
members = [
    "crates/arb-core",
    "crates/arb-os",
    "crates/arb-storage",
    "crates/arb-media",
    "crates/arb-adb",
    "crates/arbd",
    "crates/arb-cli",
    "crates/arb-tray",
]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
arb-core = { path = "crates/arb-core" }
arb-os = { path = "crates/arb-os" }
arb-storage = { path = "crates/arb-storage" }
arb-media = { path = "crates/arb-media" }
arb-adb = { path = "crates/arb-adb" }
stateright = { version = "0.31", default-features = false }

# BeautifulRust strict workspace lints (vendored from morganlinton/BeautifulRust).
# CI/local gate enforces `-D warnings` via `core/scripts/verify.sh`.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panics: return errors, and give every intentional panic a reason.
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"

# Suppressions must explain themselves and expire when no longer needed.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Unsafe must be justified.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

# API shape.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

# Evolution.
exhaustive_enums = "warn"

# Idioms.
string_add = "warn"
wildcard_imports = "warn"

# Output and debugging leftovers.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Casts that silently lose information.
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

# Pedantic lints that are mostly noise in practice, or that the skill disagrees with.
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
