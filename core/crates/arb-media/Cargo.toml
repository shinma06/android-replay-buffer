[package]
name = "arb-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPL-free media engine for Android Replay Buffer (ARB) (pure-Rust ISO-BMFF avc1 mux/demux, VideoCodecBackend, frame-accurate zero-elst trim, GOP-LRU playback)."

[dependencies]
arb-os.workspace = true
arb-core.workspace = true
openh264 = "0.9"
png = "0.17"
rusty_aac = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[features]
# PDD Layer 1: also run the Kani harnesses that do not finish within the CI timebox.
kani-extended = []

[lints]
workspace = true
