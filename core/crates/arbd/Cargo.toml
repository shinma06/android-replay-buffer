[package]
name = "arbd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single-writer local daemon for Android Replay Buffer (ARB)."

[dependencies]
arb-adb.workspace = true
arb-core.workspace = true
arb-media.workspace = true
arb-os.workspace = true
arb-storage.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
stateright = { workspace = true }
rusqlite = "0.35"
png = "0.17"
rusty_aac = { version = "2", default-features = false }
tempfile = "3"

[features]
# PDD Layer 1: also run the Kani harnesses that do not finish within the CI timebox.
kani-extended = []

[lints]
workspace = true
