[package]
name = "arb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure domain model for Android Replay Buffer (ARB) (dual-layer time, 3-valued selection, WORM bundle schemas, state machines)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"

[features]
# PDD Layer 1: also run the Kani harnesses that do not finish within the CI timebox.
kani-extended = []

[lints]
workspace = true
