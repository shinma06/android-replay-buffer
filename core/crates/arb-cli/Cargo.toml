[package]
name = "arb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI client for Android Replay Buffer (ARB) communicating with arbd over local IPC."

[dependencies]
arb-core.workspace = true
arb-os.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
semver = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
arb-adb.workspace = true
arb-media.workspace = true
arb-storage.workspace = true
arbd = { path = "../arbd" }
rusty_aac = { version = "2", default-features = false }
tempfile = "3"

[lints]
workspace = true
