[package]
name = "arb-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Three-zone storage engine for Android Replay Buffer (ARB) (live ring chunks, WORM + legacy bundle I/O, SQLite WAL catalog and leases)."

[dependencies]
arb-core.workspace = true
arb-os.workspace = true
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
