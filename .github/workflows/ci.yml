name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.15.0'
      - name: Classify changes
        id: impact
        run: python3 scripts/workflow/change_impact.py --event
      - uses: actions/setup-java@v6.1.0
        if: steps.impact.outputs.plugin_check == 'true'
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6.4.0
        if: steps.impact.outputs.plugin_check == 'true'
      - name: Prepare pinned Android build API
        if: steps.impact.outputs.plugin_check == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$(mktemp -d "$RUNNER_TEMP/replay-android-sdk.XXXXXX")"
          archive="$sdk_dir/platform-37.2_r01.zip"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --max-time 120 --output "$archive" \
            https://dl.google.com/android/repository/platform-37.2_r01.zip
          echo "916410633df92a98da56aa7c87a1955f865f4d3b888373660794ef8173f72972  $archive" | sha256sum -c -
          mkdir -p "$sdk_dir/platforms/android-37.2"
          jar="$sdk_dir/platforms/android-37.2/android.jar"
          unzip -p "$archive" android-37.2/android.jar > "$jar"
          echo "1db2419dbd45457f83b90ef8a7ef41e118174782c9a5c2185b55899df022767f  $jar" | sha256sum -c -
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
      - name: Harness and affected integrated product checks
        run: python3 scripts/workflow/change_impact.py --event --run-tests
      - uses: actions/upload-artifact@v7.0.2
        if: steps.impact.outputs.distribution == 'true'
        with:
          name: plugin-${{ github.sha }}
          path: plugin/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
