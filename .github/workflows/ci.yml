name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.15.0'
      - name: Classify changes
        id: impact
        run: python3 scripts/workflow/change_impact.py --event
      - uses: actions/setup-java@v6.1.0
        if: steps.impact.outputs.plugin_check == 'true'
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6.4.0
        if: steps.impact.outputs.plugin_check == 'true'
      - name: Harness and affected integrated product checks
        run: python3 scripts/workflow/change_impact.py --event --run-tests
      - uses: actions/upload-artifact@v7.0.2
        if: steps.impact.outputs.distribution == 'true'
        with:
          name: plugin-${{ github.sha }}
          path: plugin/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
