name: CI
# Android Replay Buffer (ARB): Rust core / device-agent / ide-plugin の検証と配布物ビルド。
# ブランチ保護が要求するチェック名は `test` / `os-parity (macos-latest)` / `os-parity (windows-latest)`。
# job の `name:` を変えるとルールセットを満たせなくなるため、改名しないこと。
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      release_gate:
        description: '指定したブランチの 3 OS 配布ゲートを実行する'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # develop/main への push は取り消さず待たせ、early の公開が途中で止まらないようにする。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  release-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.release_gate
    uses: ./.github/workflows/release-gate.yml
  test:
    if: ${{ !inputs.release_gate }}
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install nasm
        # openh264-sys2 は x86_64 で nasm があると SIMD アセンブリを使う（無いと遅い純 C）。
        run: sudo apt-get update && sudo apt-get install -y nasm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: core
      - uses: actions/cache@v4.2.3
        id: sara-cache
        with:
          path: ~/.cargo/bin/sara
          key: sara-cli-${{ runner.os }}-0.12.3-v1
      - name: Install sara-cli
        if: steps.sara-cache.outputs.cache-hit != 'true'
        run: cargo install sara-cli --version 0.12.3 --no-default-features --locked
      - name: Prepare pinned Android SDK (android-37.2 + runner build-tools)
        shell: bash
        run: ./device-agent/scripts/setup-android-sdk.sh
      - name: core/scripts/verify.sh (fmt / clippy / test / license / sara strict / REQ coverage)
        run: ./core/scripts/verify.sh
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path core/Cargo.toml --workspace --no-deps
      - name: Helper script self-tests
        run: |
          python3 core/scripts/devin_verify_player_matrix.py --self-test
          python3 core/scripts/package_distribution.py --self-test
          python3 core/scripts/verify_release_bundle.py --self-test
          python3 core/scripts/release_gate_summary.py --self-test
          python3 core/scripts/windows_gui_evidence.py --self-test
      - name: device-agent build + host protocol tests (companion + scrcpy-audio DEX jars)
        run: |
          set -euo pipefail
          ./device-agent/build.sh --with-scrcpy-audio 2>&1 | tee device-agent-build.log
          grep -q "ProtocolTest: ALL 19 TESTS PASSED" device-agent-build.log
      - name: Build arbd + arb-cli + arb-tray (release)
        run: cargo build --manifest-path core/Cargo.toml --release -p arbd -p arb-cli -p arb-tray
      - name: Resolve plugin version
        id: version
        run: |
          set -euo pipefail
          base="$(sed -n 's/^devBaseVersion=//p' ide-plugin/gradle.properties)"
          echo "plugin_version=${base}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: ./gradlew test buildPlugin verifyPluginProjectConfiguration (self-contained zero-zsh plugin ZIP)
        working-directory: ide-plugin
        env:
          ARB_DAEMON_BIN: ${{ github.workspace }}/core/target/release/arbd
          PLUGIN_VERSION: ${{ steps.version.outputs.plugin_version }}
        # ../core/target/release と ../device-agent/build を自動検出して同梱する。
        # verifyPluginProjectConfiguration は plugin.xml / Gradle 設定の軽量検査。互換性の本検査（verifyPlugin）は
        # release-gate.yml の plugin-verifier ジョブで Android Studio 2026.2.2.8 に対して実行する。
        run: ./gradlew test buildPlugin verifyPluginProjectConfiguration --no-daemon "-PpluginVersion=${PLUGIN_VERSION}"
      - name: Verify plugin ZIP contents
        run: |
          python3 - <<'PY'
          import glob, zipfile
          zips = sorted(glob.glob("ide-plugin/build/distributions/arb-ide-plugin-*.zip"))
          assert len(zips) == 1, f"expected exactly one plugin ZIP, found {zips}"
          with zipfile.ZipFile(zips[0]) as zf:
              names = zf.namelist()
          for suffix in (
              "/native/linux-x86_64/arbd",
              "/native/linux-x86_64/arb-cli",
              "/native/linux-x86_64/arb-tray",
              "/device-agent/arb-companion.dex.jar",
              "/device-agent/replay-scrcpy-audio.dex.jar",
              "/licenses/LICENSE-MIT",
              "/licenses/LICENSE-APACHE",
              "/licenses/THIRD_PARTY_NOTICES.md",
          ):
              assert any(n.endswith(suffix) for n in names), f"missing {suffix} in {zips[0]}"
          print(f"Verified self-contained zero-zsh plugin ZIP: {zips[0]}")
          PY
      - name: Package self-contained Linux bundle
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.plugin_version }}
        run: |
          set -euo pipefail
          python3 core/scripts/package_distribution.py \
            --target-os linux \
            --arch "$RUNNER_ARCH" \
            --version "$PLUGIN_VERSION" \
            --bin-dir core/target/release \
            --device-agent-dir device-agent/build \
            --out-dir dist
          cp ide-plugin/build/distributions/arb-ide-plugin-*.zip dist/
          ls -lh dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-Linux-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-linux
          path: |
            ide-plugin/build/test-results/**/*.xml
            ide-plugin/*/build/test-results/**/*.xml
            device-agent-build.log
          retention-days: 3
          if-no-files-found: ignore

  os-parity:
    if: ${{ !inputs.release_gate }}
    name: os-parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install nasm (Windows)
        # windows-latest には Chocolatey が標準で入っている。
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: core
      - name: cargo fmt --check
        run: cargo fmt --manifest-path core/Cargo.toml --all --check
      - name: cargo clippy
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path core/Cargo.toml --workspace
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path core/Cargo.toml --workspace --no-deps
      - name: License check
        run: python3 core/scripts/check-licenses.py --manifest-path core/Cargo.toml
      - name: Architecture structural guards (RS-1..RS-5)
        run: python3 core/scripts/check-architecture.py
      - name: Helper script self-tests
        run: |
          python3 core/scripts/devin_verify_player_matrix.py --self-test
          python3 core/scripts/package_distribution.py --self-test
          python3 core/scripts/verify_release_bundle.py --self-test
          python3 core/scripts/release_gate_summary.py --self-test
          python3 core/scripts/windows_gui_evidence.py --self-test
      - name: Build release binaries
        run: cargo build --manifest-path core/Cargo.toml --release -p arbd -p arb-cli -p arb-tray
      - name: Resolve arbd binary
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          echo "ARB_DAEMON_BIN=${GITHUB_WORKSPACE}/core/target/release/arbd${exe}" >> "$GITHUB_ENV"
      - name: ide-plugin tests (macOS - full)
        if: runner.os == 'macOS'
        working-directory: ide-plugin
        run: ./gradlew test --no-daemon
      - name: ide-plugin client-core tests (Windows)
        # Windows 名前付きパイプの FNV-1a ハッシュ一致・UTF-8 フレーミング・名前付きパイプ IPC を実機 OS で検証する。
        if: runner.os == 'Windows'
        working-directory: ide-plugin
        run: ./gradlew :client-core:test --no-daemon
      - name: Package self-contained distribution ZIP
        run: |
          set -euo pipefail
          base="$(sed -n 's/^devBaseVersion=//p' ide-plugin/gradle.properties)"
          python3 core/scripts/package_distribution.py \
            --target-os "$RUNNER_OS" \
            --arch "$RUNNER_ARCH" \
            --version "${base}-dev.${GITHUB_SHA::7}" \
            --bin-dir core/target/release \
            --out-dir dist \
            --allow-missing-ide-plugin \
            --allow-missing-device-agent
          ls -lh dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ runner.os }}-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: |
            ide-plugin/build/test-results/**/*.xml
            ide-plugin/*/build/test-results/**/*.xml
          retention-days: 3
          if-no-files-found: ignore

  early:
    name: early
    needs: [test, os-parity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'shinma06/android-replay-buffer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: early-release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH_NAME: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Publish rolling prerelease with assembled 3-OS universal CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          # develop だけがローリング prerelease `early` を公開する。
          TAG="early"
          TITLE="Android Replay Buffer early"
          current="$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH_NAME" -q .object.sha)"
          if [ "$current" != "$SHA" ]; then
            echo "$BRANCH_NAME moved to $current; skipping superseded $SHA"
            exit 0
          fi
          raw="$RUNNER_TEMP/early-raw"
          dist="$RUNNER_TEMP/early"
          mkdir -p "$raw" "$dist"
          for os in Linux macOS Windows; do
            gh run download "$RUN_ID" -n "dist-$os-$SHA" -D "$raw/$os"
          done
          base="$(sed -n 's/^devBaseVersion=//p' ide-plugin/gradle.properties)"
          ver="${base}-dev.${SHA:0:7}"
          python3 core/scripts/package_distribution.py \
            --assemble-release \
            --version "$ver" \
            --input-dir "$raw" \
            --out-dir "$dist"
          shopt -s nullglob
          zips=("$dist"/*.zip)
          [ "${#zips[@]}" -ge 4 ] || { echo "expected at least 4 ZIPs (3 bundles + universal plugin), found ${#zips[@]}"; exit 1; }
          plugin_zips=("$dist"/arb-ide-plugin-"${ver}".zip)
          [ "${#plugin_zips[@]}" -eq 1 ] || { echo "expected one universal plugin ZIP, found ${#plugin_zips[@]}"; exit 1; }
          names=()
          for z in "${zips[@]}"; do names+=("$(basename "$z")"); done
          dups="$(printf '%s\n' "${names[@]}" | sort | uniq -d)"
          [ -z "$dups" ] || { echo "duplicate asset names: $dups"; exit 1; }
          notes="$RUNNER_TEMP/early-notes.md"
          {
            echo "# $TITLE"
            echo
            echo "\`$BRANCH_NAME\` の最新の開発版です。Linux・macOS・WindowsのCIは通っていますが、VMでのIDE・エミュレータ受入はしていません。正式版は [Latest](https://github.com/$GH_REPO/releases/latest) を使ってください。"
            echo
            echo "- Commit: \`$SHA\`"
            echo "- CI: $RUN_URL"
            echo
            echo "## 配布物（SHA-256）"
            for z in "${zips[@]}"; do
              n="$(basename "$z")"
              echo "- [\`$n\`](https://github.com/$GH_REPO/releases/download/$TAG/$n): \`$(sha256sum "$z" | cut -d' ' -f1)\`"
            done
          } > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${zips[@]}" --clobber
            gh release edit "$TAG" --prerelease --latest=false --title "$TITLE" --notes-file "$notes"
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$SHA" -F force=true > /dev/null
            gh release view "$TAG" --json assets -q '.assets[].name' | while read -r asset; do
              keep=0
              for n in "${names[@]}"; do [ "$asset" = "$n" ] && keep=1; done
              if [ "$keep" -eq 0 ]; then gh release delete-asset "$TAG" "$asset" -y; fi
            done
          else
            gh release create "$TAG" "${zips[@]}" --target "$SHA" --prerelease --latest=false --title "$TITLE" --notes-file "$notes"
          fi
