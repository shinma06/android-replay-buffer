name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Prepare pinned Android build API
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$(mktemp -d "$RUNNER_TEMP/replay-android-sdk.XXXXXX")"
          archive="$sdk_dir/platform-37.2_r01.zip"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --max-time 120 --output "$archive" \
            https://dl.google.com/android/repository/platform-37.2_r01.zip
          echo "916410633df92a98da56aa7c87a1955f865f4d3b888373660794ef8173f72972  $archive" | sha256sum -c -
          mkdir -p "$sdk_dir/platforms/android-37.2"
          jar="$sdk_dir/platforms/android-37.2/android.jar"
          unzip -p "$archive" android-37.2/android.jar > "$jar"
          echo "1db2419dbd45457f83b90ef8a7ef41e118174782c9a5c2185b55899df022767f  $jar" | sha256sum -c -
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
      - name: Build plugin
        run: plugin/gradlew -p plugin --no-daemon check buildPlugin verifyPluginStructure -PpluginVersion="${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" plugin/build/distributions/*.zip --verify-tag --generate-notes
