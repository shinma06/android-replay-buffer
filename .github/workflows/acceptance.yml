name: Acceptance
on:
  push:
    branches: [main]
  issues:
    types: [edited, deleted, labeled, unlabeled]
  issue_comment:
    types: [edited, deleted]
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
  actions: write
concurrency:
  group: acceptance-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  acceptance:
    name: Acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only reviewed base code runs. PR JSON is read with git show as data.
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/heads/${{ github.event.pull_request.base.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.15.0'
      - name: Check acceptance using the trusted base
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Initial adoption only: these observed base commits predate the validator.
          # Local tests and independent review remain mandatory; no GUI pass is asserted.
          case "$(git rev-parse HEAD):$BASE_REF:$HEAD_REF" in
            e6fb021b144d4f0f6a1f7916e92449610b3ff80c:main:codex/1-adopt-harness)
              echo 'Initial harness bootstrap: independent review and test required; application acceptance not evaluated.'
              ;;
            *) python3 scripts/workflow/acceptance_ci.py ;;
          esac
