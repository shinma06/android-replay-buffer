name: v2 CI
# v2（Rust core / device-agent / ide-plugin）専用の 3 OS 検証・パッケージング。
# 既存の ci.yml（旧プラグイン）とは独立して動く。
on:
  push:
    paths:
      - 'core/**'
      - 'device-agent/**'
      - 'ide-plugin/**'
      - 'docs/v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'device-agent/**'
      - 'ide-plugin/**'
      - 'docs/v2/**'
      - '.github/workflows/v2-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  rust-3os-parity:
    name: rust-3os-parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install nasm (Linux)
        # openh264-sys2 は x86_64 で nasm があると SIMD アセンブリを使う（無いと遅い純 C）。
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Install nasm (Windows)
        # windows-latest には Chocolatey が標準で入っている。
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          (nasm -v || echo "nasm not installed (expected on arm64 macOS)")
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: core
      - name: cargo fmt --check
        run: cargo fmt --manifest-path core/Cargo.toml --all --check
      - name: cargo clippy
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path core/Cargo.toml --workspace
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path core/Cargo.toml --workspace --no-deps
      - name: License check
        run: python3 core/scripts/check-licenses.py --manifest-path core/Cargo.toml
      - name: Player-matrix helper self-test
        run: python3 core/scripts/devin_verify_player_matrix.py --self-test
      - name: Build release binaries
        run: cargo build --manifest-path core/Cargo.toml --release -p arbd -p arb-cli -p arb-tray
      - name: Collect binaries
        run: |
          set -euo pipefail
          out="dist/arb-${{ runner.os }}-${{ runner.arch }}"
          mkdir -p "$out"
          for b in arbd arb-cli arb-tray; do
            for f in "core/target/release/$b" "core/target/release/$b.exe"; do
              [ -f "$f" ] && cp "$f" "$out/"
            done
          done
          ls -l "$out"
          [ "$(ls "$out" | wc -l)" -ge 3 ]
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: arb-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/arb-*
          if-no-files-found: error
          retention-days: 14

  sara-and-traceability:
    name: sara-and-traceability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v4.2.3
        id: sara-cache
        with:
          path: ~/.cargo/bin/sara
          key: sara-cli-${{ runner.os }}-locked-v1
      - name: Install sara-cli
        if: steps.sara-cache.outputs.cache-hit != 'true'
        run: cargo install sara-cli --no-default-features --locked
      - name: sara check --strict
        run: sara check --strict -c docs/v2/sara.toml
      - name: REQ downstream coverage (14/14)
        run: |
          set -euo pipefail
          sara report matrix --format json -c docs/v2/sara.toml | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          reqs = {r["source_id"] for r in data.get("rows", []) if r.get("source_type") == "Requirement"}
          satisfied = {
              t["id"]
              for r in data.get("rows", [])
              if r.get("source_type") == "Specification"
              for t in r.get("targets", [])
              if t.get("relationship") == "satisfies" and t.get("target_type") == "Requirement"
          }
          orphans = sorted(reqs - satisfied)
          if len(reqs) != 14 or orphans:
              print(f"ERROR: expected 14 REQ all covered; got {len(reqs)} REQ, orphans={orphans}", file=sys.stderr)
              sys.exit(1)
          print(f"req-coverage-check: OK ({len(reqs)}/{len(reqs)})")
          '

  device-agent-host-tests:
    name: device-agent-host-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - name: Prepare pinned Android SDK (android-37.2 + runner build-tools)
        run: |
          set -euo pipefail
          sdk_dir="$(mktemp -d "$RUNNER_TEMP/replay-android-sdk.XXXXXX")"
          archive="$sdk_dir/platform-37.2_r01.zip"
          curl --fail --location --max-time 120 --output "$archive" \
            https://dl.google.com/android/repository/platform-37.2_r01.zip
          echo "916410633df92a98da56aa7c87a1955f865f4d3b888373660794ef8173f72972  $archive" | sha256sum -c -
          mkdir -p "$sdk_dir/platforms/android-37.2"
          jar="$sdk_dir/platforms/android-37.2/android.jar"
          unzip -p "$archive" android-37.2/android.jar > "$jar"
          echo "1db2419dbd45457f83b90ef8a7ef41e118174782c9a5c2185b55899df022767f  $jar" | sha256sum -c -
          rm -f "$archive"
          # d8 は runner 既設の build-tools を借りる。
          runner_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ln -s "$runner_sdk/build-tools" "$sdk_dir/build-tools"
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
      - name: device-agent build + host protocol tests
        run: |
          set -euo pipefail
          ./device-agent/build.sh 2>&1 | tee device-agent-build.log
          grep -q "ProtocolTest: ALL 19 TESTS PASSED" device-agent-build.log

  ide-plugin-tests:
    name: ide-plugin-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Detect ide-plugin Gradle wrapper
        id: detect
        run: |
          if [ -f ide-plugin/gradlew ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "ide-plugin/gradlew not found yet; skipping (W8 not merged)"; fi
      - uses: actions/setup-java@v6.1.0
        if: steps.detect.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6.4.0
        if: steps.detect.outputs.present == 'true'
      - uses: Swatinem/rust-cache@v2.7.8
        if: steps.detect.outputs.present == 'true'
        with:
          workspaces: core
      - name: Build arbd + arb-cli for real IPC/SHM integration tests
        if: steps.detect.outputs.present == 'true'
        run: cargo build --manifest-path core/Cargo.toml --release -p arbd -p arb-cli
      - name: ./gradlew test
        if: steps.detect.outputs.present == 'true'
        working-directory: ide-plugin
        env:
          ARB_BIN_DIR: ${{ github.workspace }}/core/target/release
        run: ./gradlew test --no-daemon
